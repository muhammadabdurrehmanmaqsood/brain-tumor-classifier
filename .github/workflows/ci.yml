name: MLOps CI Pipeline

# 1. Trigger the workflow on pushes or pull requests to main/master branches
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 2. Check out the repository code onto the runner
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 3. Set up a clean Python environment
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.11'
        cache: 'pip' # Automatically caches dependencies for faster subsequent runs

    # 4. Install dependencies from your existing requirements file
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 5. Lint the codebase to catch syntax errors or undefined variables
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub Editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 6. Verify core script compilations (Smoke Test)
    - name: Pipeline Smoke Test
      run: |
        python -c "import src.model; print('Model module compiled successfully!')"
        python -c "import src.dataset; print('Dataset module compiled successfully!')"
